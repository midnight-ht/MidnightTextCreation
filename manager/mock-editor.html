<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模拟编辑页 · Midnight</title><link rel="stylesheet" href="/manager/style.css"><script defer src="/manager/mock-editor.js"></script></head><body><header><div><span class="eyebrow">MIDNIGHT / MOCK ONLY</span><h1>模拟平台编辑页</h1><p>演示浏览器填充与读取，不会发布到真实平台。</p></div></header><main><article><span class="badge mock">模拟 MOCK</span><p>账号：<strong id="account"></strong> · 内容 ID：<strong id="content-id"></strong></p><label>标题<input id="title"></label><label>正文<textarea id="body" rows="10"></textarea></label><label>摘要<textarea id="summary" rows="3"></textarea></label><label>标签<input id="tags"></label><label>模拟业务状态<select id="status"><option value="processing">processing · 审核中</option><option value="published">published · 已发布</option><option value="rejected">rejected · 驳回</option><option value="removed">removed · 删除</option></select></label><label>模拟阅读数（留空表示不可用）<input id="reads" type="number" min="0" step="1"></label><p class="muted">没有发布按钮。状态与阅读数仅供浏览器回收演示。</p></article></main></body></html>
