<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容工作台 · Midnight</title><link rel="stylesheet" href="/manager/style.css"><script defer src="/manager/app.js"></script></head>
<body><header><div><span class="eyebrow">MIDNIGHT / LOCAL WORKSPACE</span><h1>内容工作台</h1><p>按账号整理风格、内容版本与发布状态</p></div><button id="refresh" type="button">刷新数据</button></header><div id="notice" role="status" aria-live="polite">正在连接本机服务…</div><nav aria-label="工作台导航"><button data-tab="content" class="active">内容与发布</button><button data-tab="config">账号与风格</button><button data-tab="advanced">高级配置</button></nav>
<main><section id="content" class="panel"><div class="workspace"><aside><h2>准备内容</h2><form id="content-form"><label>平台绑定<select id="selected-binding" required></select></label><div id="binding-info" class="muted"></div><label>已有内容 ID（可选，新建版本）<input name="content_id"></label><label>标题 / 主题<input name="title"></label><label>原始素材<textarea name="raw_material" rows="6"></textarea></label><label>本次风格<select name="style_id"></select></label><label>本次输出目录（可选）<input name="output_dir"></label><details><summary>高级输入参数</summary><label>输入参数 JSON<textarea name="input" rows="5">{}</textarea></label><label>单次覆盖 JSON<textarea name="overrides" rows="3">{}</textarea></label><label>完整 publication JSON（导入时使用）<textarea name="publication" rows="8">{"selected_title":"","body":"","summary":"","tags":[],"media":[]}</textarea></label></details><label>审稿状态<select name="review_status"><option value="needs_human_review">待人工审稿</option><option value="ready_for_human_review">可供人工审稿</option></select></label><div class="actions"><button type="submit" name="action" value="generate">生成内容</button><button type="submit" name="action" value="import" class="secondary">导入模型内容</button></div></form><p class="muted">导入保留完整 JSON；生成参数与单次覆盖不会修改风格预设。</p></aside><div><div class="section-head"><h2>内容版本</h2><span class="muted">填充停在草稿</span></div><div id="contents" class="stack"></div><h2>发布与回收</h2><p class="muted">查询失败会保留上次成功记录；模拟结果仅用于演示。</p><div id="publications" class="stack"></div><h2>最近任务</h2><div id="tasks" class="stack"></div></div></div></section>
<section id="config" class="panel" hidden><div class="config-grid"><article><h2>账号</h2><div id="accounts-list"></div><form id="account-form"><label>账号 ID<input name="id" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,79}"></label><label>显示名称<input name="name" required></label><label>默认输出目录<input name="output_dir" placeholder="例如 D:\内容输出"></label><label class="inline"><input type="checkbox" name="enabled" checked>启用</label><button>保存账号</button></form></article>
<article><h2>平台绑定</h2><div id="bindings-list"></div><form id="binding-form"><label>绑定 ID<input name="id" required></label><label>账号<select name="account_id" required></select></label><label>平台<select name="platform" required></select></label><label>浏览器中预期账号<input name="expected_account" required></label><label>风格<select name="style_id" required></select></label><label>输出目录（覆盖账号）<input name="output_dir"></label><label>适配器<select name="mode"><option value="mock">模拟 mock</option><option value="browser">浏览器 browser · 待现场验证</option><option value="api">API · 需正式授权</option></select></label><label>编辑页 URL<input name="editor_url" type="url"></label><label>回收页 URL<input name="collector_url" type="url"></label><button>保存绑定</button></form></article>
<article><h2>风格预设</h2><div id="styles-list"></div><form id="style-form"><label>风格 ID<input name="id" required></label><label>名称<input name="name" required></label><label>语气<input name="tone"></label><label>目标读者<input name="target_reader"></label><label>语言<select name="language"><option value="zh">中文</option><option value="en">English</option></select></label><label>适用平台（筛选格式）<select name="format_platform"></select></label><label>内容格式<select name="format"></select></label><label>风格指导<textarea name="style_guidance" rows="4"></textarea></label><label>作者样文<textarea name="author_samples" rows="4"></textarea></label><label>禁用风格 / 主张<textarea name="forbidden_style" rows="3"></textarea></label><button>保存风格</button></form></article></div></section>
<section id="advanced" class="panel" hidden><article><h2>完整配置 JSON</h2><p class="muted">简单表单保留选择器、状态映射与 API 配置等高级字段。请勿存入密码、Cookie 或 Token；凭据通过环境变量引用。</p><label>配置<textarea id="config-json" rows="24" spellcheck="false"></textarea></label><div class="actions"><button id="save-json">校验并保存</button><button id="export-config" class="secondary">导出 JSON</button><label class="file-button">导入 JSON 文件<input id="import-config" type="file" accept=".json,application/json"></label></div></article></section></main><footer>本机服务 · 真实平台能力以现场验证为准</footer></body></html>
